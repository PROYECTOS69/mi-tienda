<style>
  :root { --brand:#0f766e; --accent:#f59e0b; --on-brand:#ffffff; --focus:#1d4ed8; }
  body { -webkit-tap-highlight-color: transparent; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .btn { min-height:48px; border-radius:14px; font-weight:600; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn-brand { background:var(--brand); color:var(--on-brand); }
  .btn-soft { background:#e5e7eb; color:#111827; }
  .btn-wa { background:#15803d; color:#fff; }
  .input { width:100%; min-height:48px; border:1.5px solid #6b7280; border-radius:12px; padding:10px 14px; font-size:16px; background:#fff; color:#111827; }
  .input[aria-invalid=true] { border-color:#b91c1c; border-width:2px; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; box-shadow:0 0 0 5px #fff; }

  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; scroll-behavior:auto !important; } }

<body class="bg-gray-100 text-gray-900">
<a class="skip" href="#view">Saltar al contenido</a>

<header id="topbar" class="sticky top-0 z-30 bg-[var(--brand)] px-4 pt-3 pb-3 flex items-center gap-3 shadow" style="color:var(--on-brand)">

  <button id="btnLogout" class="text-sm underline min-h-[44px] px-2 hidden">Salir</button>
</header>

<main id="view" tabindex="-1" class="p-4 max-w-2xl mx-auto focus:outline-none"></main>

<nav aria-label="Navegación principal" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t flex justify-around" style="padding-bottom:env(safe-area-inset-bottom)">

  <button data-tab="products" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">🛍️</span>Productos</button>
  <button data-tab="customers" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">👥</span>Clientes</button>
  <button data-tab="offers" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">📣</span>Ofertas</button>
  <button data-tab="settings" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">⚙️</span>Ajustes</button>
</nav>

<div id="modal" class="fixed inset-0 z-50 hidden bg-black/50 flex items-end sm:items-center justify-center">
  <div id="modalBody" tabindex="-1" class="sheet bg-gray-50 w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 focus:outline-none"></div>
</div>
<div id="toast" aria-hidden="true" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] bg-gray-900 text-white text-sm px-4 py-2 rounded-full hidden max-w-[90vw] text-center"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
/* ============================== UTILIDADES ============================== */
const CFG = window.APP_CONFIG || {};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3200);
  const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30);
}
function safeUrl(u) {
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}
function lum(hex) {
  const h = String(hex || '#000').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const f = c => (c /= 255) <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255);
}
const onColor = hex => lum(hex) > .179 ? '#111827' : '#ffffff';

/* Etiquetas asociadas a sus campos (lectores de pantalla) */
function a11y(root = document) {
  root.querySelectorAll('label.lbl').forEach(l => {
    if (l.htmlFor) return; const n = l.nextElementSibling;
    if (n && n.id && /^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName)) l.htmlFor = n.id;
  });
}
/* Ventanas (modal) accesibles */
let _lastFocus = null;
const BG = () => ['#topbar', '#view', 'nav'].map(s => $(s)).filter(Boolean);
function openModal(html) {
  const m = $('#modal'), b = $('#modalBody'), was = !m.classList.contains('hidden'), st = b.scrollTop;
  if (!was) _lastFocus = document.activeElement;
  b.innerHTML = html; m.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  b.setAttribute('role', 'dialog'); b.setAttribute('aria-modal', 'true');
  const h = b.querySelector('h2,h3'); if (h) { h.id = 'dlgTitle'; b.setAttribute('aria-labelledby', 'dlgTitle'); }
  BG().forEach(e => { e.inert = true; }); a11y(b); b.scrollTop = was ? st : 0; if (!was) b.focus({ preventScroll: true });
}
function closeModal() {
  $('#modal').classList.add('hidden'); document.body.style.overflow = ''; $('#modalBody').innerHTML = '';
  BG().forEach(e => { e.inert = false; });
  if (_lastFocus && document.contains(_lastFocus)) _lastFocus.focus({ preventScroll: true }); _lastFocus = null;
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  const open = !$('#modal').classList.contains('hidden');
  if (open && e.key === 'Escape') { closeModal(); return; }
  if (open && e.key === 'Tab') {
    const f = [...$('#modalBody').querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null || x.classList.contains('sr-only'));
    if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === a || document.activeElement === $('#modalBody'))) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
  const t = e.target.closest && e.target.closest('[role=button]');
  if (t && e.target === t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
});
document.addEventListener('input', e => { if (e.target.removeAttribute) e.target.removeAttribute('aria-invalid'); });

function normPhone(p, cc) {
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  cc = cc || '58';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = cc + d.slice(1);       // 0412... -> 58412...
  else if (d.length <= 10 && !d.startsWith(cc)) d = cc + d;
  return d;
}

/* ============================ CAPA DE DATOS ============================= */
// Con credenciales usa Supabase; sin ellas funciona en modo demo (localStorage).
const sb = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)
  ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

/* Si falta ejecutar schema_legal.sql, las columnas nuevas no existen: se guardan sin ellas y se avisa. */
const missingCol = err => { const m = /Could not find the '([^']+)' column/.exec((err && err.message) || ''); return m ? m[1] : null; };
async function sbWrite(run, rows) {
  const arr = Array.isArray(rows) ? rows : [rows];
  for (let i = 0; i < 10; i++) {
    const r = await run(Array.isArray(rows) ? arr : arr[0]);
    if (!r.error) return r;
    const c = missingCol(r.error); if (!c || !arr.some(x => c in x)) throw r.error;
    arr.forEach(x => { delete x[c]; }); S.needsSql = true;
  }
  throw new Error('No se pudo guardar');
}

const store = {
  async list(t, limit = 5000) {
    if (sb) { const { data, error } = await sb.from(t).select('*').order('created_at', { ascending: false }).limit(limit); if (error) throw error; return data; }
    return JSON.parse(localStorage.getItem('mk_' + t) || '[]');
  },
  async save(t, row) {
    row = { ...row };
    if (sb) {
      if (!row.id) delete row.id;
      const r = await sbWrite(x => sb.from(t).upsert(x).select().single(), row); return r.data;
    }
    const all = JSON.parse(localStorage.getItem('mk_' + t) || '[]');
    if (!row.id) { row.id = uid(); row.created_at = new Date().toISOString(); all.unshift(row); }
    else { const i = all.findIndex(x => x.id === row.id); if (i >= 0) all[i] = { ...all[i], ...row }; else all.unshift(row); }
    localStorage.setItem('mk_' + t, JSON.stringify(all)); return row;
  },
  async saveMany(t, rows) {
    if (sb) {
      for (let i = 0; i < rows.length; i += 500) {
        const batch = rows.slice(i, i + 500).map(x => ({ ...x }));
        await sbWrite(x => sb.from(t).upsert(x, { onConflict: 'phone', ignoreDuplicates: true }), batch);
      }
      return;
    }
    const all = JSON.parse(localStorage.getItem('mk_' + t) || '[]');
    const seen = new Set(all.map(x => x.phone || x.email));
    rows.forEach(r => { const k = r.phone || r.email; if (k && seen.has(k)) return; seen.add(k); all.unshift({ ...r, id: uid(), created_at: new Date().toISOString() }); });
    localStorage.setItem('mk_' + t, JSON.stringify(all));
  },
  async remove(t, id) {
    if (sb) { const { error } = await sb.from(t).delete().eq('id', id); if (error) throw error; return; }
    const all = JSON.parse(localStorage.getItem('mk_' + t) || '[]').filter(x => x.id !== id);
    localStorage.setItem('mk_' + t, JSON.stringify(all));
  },
  async getSettings() {
    if (sb) { const { data } = await sb.from('business_settings').select('*').eq('id', 'main').maybeSingle(); return data || {}; }
    return JSON.parse(localStorage.getItem('mk_settings') || '{}');
  },
  async saveSettings(s) {
    s = { ...s, id: 'main', updated_at: new Date().toISOString() };
    if (sb) { await sbWrite(x => sb.from('business_settings').upsert(x), s); return; }
    localStorage.setItem('mk_settings', JSON.stringify(s));
  }
};

/* ===================== SUBIDA DE IMÁGENES + COMPRESIÓN ================== */
// Comprime en el teléfono (máx 1280px, JPEG 80%) antes de subir => cargas ultrarrápidas.
function compressImage(file, maxSize = 1280, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('No se pudo comprimir')); }, 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('Imagen inválida'));
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });

async function uploadImage(file) {
  const blob = await compressImage(file);
  if (CFG.CLOUDINARY_CLOUD_NAME && CFG.CLOUDINARY_UPLOAD_PRESET) {
    const fd = new FormData(); fd.append('file', blob); fd.append('upload_preset', CFG.CLOUDINARY_UPLOAD_PRESET);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
    const j = await r.json(); if (!j.secure_url) throw new Error('Falló la subida a Cloudinary');
    return j.secure_url.replace('/upload/', '/upload/f_auto,q_auto/');   // entrega optimizada
  }
  if (sb) {
    const path = `products/${uid()}.jpg`;
    const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  }
  return await blobToDataURL(blob);   // modo demo
}

/* ============================== ESTADO ================================== */
const S = { tab: 'home', settings: {}, products: [], customers: [], orders: [], custLimit: 40, custQuery: '', custFilter: 'all', needsSql: false };

function applyBrand() {
  const s = S.settings, root = document.documentElement.style;
  root.setProperty('--brand', s.color_primary || '#0f766e'); root.setProperty('--accent', s.color_accent || '#f59e0b');
  root.setProperty('--on-brand', onColor(s.color_primary || '#0f766e'));
  document.querySelector('meta[name=theme-color]').content = s.color_primary || '#0f766e';
  const nm = s.business_name && s.business_name !== 'Mi Negocio' ? s.business_name : 'Comercios Cagua';
  $('#hName').textContent = 'Panel · ' + nm;
  const l = $('#hLogo'); if (s.logo_url) { l.src = s.logo_url; l.classList.remove('hidden'); } else l.classList.add('hidden');
  $('#hMode').textContent = sb ? 'Conectado a Supabase' : 'Modo demo (datos locales)';
}

async function loadAll() {
  [S.settings, S.products, S.customers, S.orders] = await Promise.all([store.getSettings(), store.list('products'), store.list('customers', 20000), store.list('orders', 2000)]);
  if (sb && !('legal_name' in S.settings)) S.needsSql = true;
  applyBrand();
}

function go(tab) {
  S.tab = tab;
  document.querySelectorAll('nav button').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('tab-on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  ({ home: vHome, products: vProducts, customers: vCustomers, offers: vOffers, settings: vSettings })[tab]();
  a11y($('#view')); window.scrollTo(0, 0); $('#view').focus({ preventScroll: true });
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

const view = html => { $('#view').innerHTML = html; };
const waLink = (phone, text) => `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

/* =============================== INICIO ================================= */
function vHome() {
  const optin = S.customers.filter(c => c.marketing_consent).length;
  const pend = S.orders.filter(o => o.status === 'pendiente');
  const ventas = S.orders.filter(o => o.status !== 'cancelado').reduce((a, o) => a + Number(o.total || 0), 0);
  const stat = (n, l, ic) => `<div class="card p-4"><div class="text-2xl" aria-hidden="true">${ic}</div><div class="text-2xl font-bold">${n}</div><div class="text-xs text-gray-700">${l}</div></div>`;
  const s = S.settings, falta = !s.rif || !(s.contact_email || s.whatsapp) || !s.address;
  view(`
    ${S.needsSql ? `<div class="card p-4 mb-3 border-2 border-amber-500" role="alert"><b>⚠️ Falta actualizar la base de datos</b><p class="text-sm mt-1">Ejecuta <code>schema_legal.sql</code> en Supabase (SQL Editor) para registrar el consentimiento de los clientes y la aceptación de términos en cada pedido.</p></div>` : ''}
    ${falta ? `<div class="card p-4 mb-3 border-2 border-amber-500"><b>📋 Completa tus datos legales</b><p class="text-sm mt-1">Faltan datos del negocio (RIF, dirección o un medio de contacto) que aparecen en las páginas legales de la tienda.</p><button class="btn btn-soft mt-2 w-full" onclick="go('settings')">Ir a Ajustes</button></div>` : ''}
    <div class="grid grid-cols-2 gap-3">
      ${stat(S.products.length, 'Productos', '🛍️')}${stat(S.customers.length, 'Clientes', '👥')}
      ${stat(optin, 'Aceptan ofertas', '✅')}${stat(money(ventas), 'Ventas', '💰')}
    </div>
    <h2 class="font-bold mt-6 mb-2">Pedidos pendientes (${pend.length})</h2>
    <div class="space-y-3">${pend.slice(0, 15).map(o => `
      <div class="card p-4">
        <div class="flex justify-between"><b>${esc(o.customer_name)}</b><b>${money(o.total)}</b></div>
        <div class="text-xs text-gray-700 mt-1">${o.delivery_type === 'delivery' ? '🚚 Delivery' : '🏪 Retiro'} · ${esc(o.payment_method || '')} ${o.payment_ref ? '· Ref ' + esc(o.payment_ref) : ''}</div>
        ${o.terms_version ? `<div class="text-xs text-gray-700">Términos aceptados (v${esc(o.terms_version)})</div>` : ''}
        ${o.payment_proof_url ? `<a class="text-xs link inline-block py-2" href="${esc(o.payment_proof_url)}" target="_blank" rel="noopener">Ver comprobante (se abre en otra pestaña)</a>` : ''}
        <div class="flex gap-2 mt-3">
          <button class="btn btn-brand flex-1" onclick="setOrder('${o.id}','pagado')">Confirmar pago</button>
          <button class="btn btn-soft" onclick="setOrder('${o.id}','cancelado')" aria-label="Cancelar pedido de ${esc(o.customer_name)}">✕</button>
        </div>
      </div>`).join('') || '<p class="text-sm text-gray-700">Sin pedidos pendientes.</p>'}</div>
    ${!S.products.length && !sb ? `<button class="btn btn-soft w-full mt-6" onclick="seedDemo()">Cargar datos de ejemplo</button>` : ''}
  `);
}
async function setOrder(id, status) {
  const o = S.orders.find(x => x.id === id); o.status = status; await store.save('orders', o); toast('Pedido ' + status); vHome(); a11y($('#view'));
}
async function seedDemo() {
  await store.save('products', { name: 'Zapatillas Urban', description: 'Cómodas y ligeras', price: 35, category: 'Calzado', is_active: true, is_featured: true });
  await store.saveMany('customers', [
    { name: 'María Pérez', phone: '584121112233', email: 'maria@mail.com', marketing_consent: true, source: 'manual' },
    { name: 'José Rojas', phone: '584143334455', email: '', marketing_consent: true, source: 'manual' }]);
  await loadAll(); go('home'); toast('Datos de ejemplo cargados');
}

/* ============================== PRODUCTOS =============================== */
function vProducts() {
  view(`
    <div class="flex items-center justify-between mb-3"><h2 class="font-bold text-lg">Catálogo</h2>
      <button class="btn btn-brand" onclick="editProduct()">＋ Nuevo</button></div>
    <div class="space-y-3">${S.products.map(p => `
      <div class="card p-3 flex gap-3 items-center cursor-pointer" role="button" tabindex="0" onclick="editProduct('${p.id}')" aria-label="Editar producto ${esc(p.name)}">
        <img src="${esc(p.image_url || '')}" onerror="this.style.visibility='hidden'" loading="lazy" class="w-20 h-20 rounded-xl object-cover bg-gray-200" alt="">
        <div class="flex-1 min-w-0">
          <div class="font-semibold truncate">${esc(p.name)}</div>
          <div class="text-sm text-gray-700 truncate">${esc(p.category || 'Sin categoría')}</div>
          <div class="font-bold" style="color:var(--brand)">${money(p.offer_price || p.price)} ${p.offer_price ? `<s class="text-xs text-gray-600">${money(p.price)}</s>` : ''}</div>
          <div class="text-xs">${p.is_featured ? '🔥 Oferta ' : ''}${p.video_url ? '🎬 Video ' : ''}${p.is_active === false ? '🚫 Oculto' : ''}</div>
        </div>
      </div>`).join('') || '<p class="text-sm text-gray-700">Aún no hay productos. Toca “Nuevo”.</p>'}</div>`);
}
let _img = '';
function editProduct(id) {
  const p = S.products.find(x => x.id === id) || { is_active: true };
  _img = p.image_url || '';
  openModal(`
    <h2 class="font-bold text-lg mb-2">${id ? 'Editar' : 'Nuevo'} producto</h2>
    <div class="flex items-center gap-3">
      <img id="pImg" src="${esc(_img)}" class="w-24 h-24 rounded-2xl object-cover bg-gray-200" alt="Foto del producto">

/* CSV (compatible con Excel: UTF-8 con BOM) */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur.replace(/\r$/, '')); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function exportCSV() {
  if (!confirm('El archivo contendrá datos personales de tus clientes. Guárdalo en un lugar seguro y no lo compartas. ¿Continuar?')) return;
  const head = ['nombre', 'correo', 'telefono', 'acepta_ofertas', 'compras'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [head.join(',')].concat(S.customers.map(c => [c.name, c.email, c.phone, c.marketing_consent ? 'si' : 'no', S.orders.filter(o => o.customer_id === c.id).length].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'clientes.csv'; a.click();
}
async function importCSV(inp) {
  const f = inp.files[0]; if (!f) return;
  const rows = parseCSV(await f.text()); if (rows.length < 2) { inp.value = ''; return toast('Archivo vacío'); }
  const h = rows[0].map(x => x.trim().toLowerCase());
  const ix = k => h.findIndex(x => k.some(w => x.includes(w)));
  const iN = ix(['nombre', 'name']), iE = ix(['correo', 'email', 'mail']), iP = ix(['tel', 'phone', 'whats']), iO = ix(['acepta', 'consent', 'optin']);
  if (iN < 0) { inp.value = ''; return toast('Falta la columna "nombre"'); }
  const now = new Date().toISOString();
  const out = rows.slice(1).map(r => {
    const opt = iO >= 0 ? /^(si|sí|yes|1|true|x)$/i.test((r[iO] || '').trim()) : false;
    return { name: (r[iN] || '').trim(), email: iE >= 0 ? (r[iE] || '').trim() || null : null,
      phone: iP >= 0 ? normPhone(r[iP], S.settings.country_code) || null : null,
      marketing_consent: opt, consent_at: opt ? now : null, consent_source: opt ? 'import' : null,
      consent_text: opt ? 'Importado por el administrador, que declaró contar con el consentimiento del cliente' : null, source: 'import' };
  }).filter(c => c.name && (c.phone || c.email));
  const withOpt = out.filter(c => c.marketing_consent).length;
  if (withOpt && !confirm(`${withOpt} contactos están marcados como “aceptan ofertas”.\n\nAl importar declaras que tienes su consentimiento para escribirles con ofertas (y que puedes demostrarlo). Si no es así, cancela y vuelve a importar con la columna acepta_ofertas en “no”.\n\n¿Confirmas?`)) { inp.value = ''; return; }
  try { await store.saveMany('customers', out); S.customers = await store.list('customers', 20000); vCustomers(); a11y($('#view')); toast(`${out.length} contactos procesados`); }
  catch (e) { toast('Error: ' + e.message); }
}

        <ul class="list-disc pl-5 text-sm space-y-2 mt-2 text-gray-800">
          <li>Envía ofertas solo a quienes dieron su consentimiento y respeta las bajas (“BAJA”) de inmediato.</li>
          <li>Atiende en un máximo de 15 días hábiles las solicitudes de acceso, corrección o eliminación de datos.</li>
          <li>Cada pedido guarda la fecha y versión de los términos aceptados; cada consentimiento guarda su texto y origen.</li>
          <li>Protege este panel: no compartas el enlace ni tu clave, no entregues el acceso sin un compromiso de confidencialidad y cierra sesión en equipos ajenos. La sesión se cierra sola tras 30 minutos sin actividad.</li>
          <li>El CSV de clientes contiene datos personales: guárdalo en un lugar seguro y bórralo cuando ya no lo necesites.</li>
          <li>Conserva los pedidos y comprobantes el tiempo que exija la normativa fiscal; no los borres antes.</li>
          <li>Nunca pidas ni guardes claves bancarias, PIN ni datos de tarjeta.</li>
          <li>Si cambias estas políticas, avisa a los clientes y pide al técnico actualizar la versión.</li>
        </ul>
        <p class="text-xs text-gray-700 mt-2">Esta lista es orientativa y no sustituye la asesoría de un abogado o contador.</p>
      </details>
    </div>
    <h3 class="font-bold mt-5 mb-2">📱 Pago Móvil</h3>
    <div class="card p-4">${f('sPmBank', 'Banco', s.pm_bank)}${f('sPmDoc', 'Cédula / RIF', s.pm_id_doc)}${f('sPmPhone', 'Teléfono', s.pm_phone, 'tel')}</div>
    <h3 class="font-bold mt-5 mb-2">🏦 Transferencia bancaria</h3>
    <div class="card p-4">${f('sTrBank', 'Banco', s.tr_bank)}${f('sTrAcc', 'Número de cuenta', s.tr_account)}${f('sTrHolder', 'Titular', s.tr_holder)}${f('sTrDoc', 'Cédula / RIF', s.tr_id_doc)}</div>
    <h3 class="font-bold mt-5 mb-2">Entrega</h3>
    <div class="card p-4 space-y-3">
      <label class="flex items-center gap-3"><input id="sPick" type="checkbox" class="w-6 h-6" ${s.accepts_pickup !== false ? 'checked' : ''}> Retiro en tienda</label>
      <label class="flex items-center gap-3"><input id="sDel" type="checkbox" class="w-6 h-6" ${s.accepts_delivery !== false ? 'checked' : ''}> Envío a domicilio / Delivery</label>
    </div>
    <button class="btn btn-brand w-full mt-5" onclick="saveSettings()">Guardar configuración</button>
    <div id="instBox" class="card p-4 mt-5" ${_ip || /iphone|ipad|ipod/i.test(navigator.userAgent) ? '' : 'hidden'}>
      <b>📲 Instalar el panel como app</b>
      <p class="text-sm text-gray-800 mt-1">${_ip ? 'Ábrelo desde tu pantalla de inicio, sin la barra del navegador.' : 'En iPhone: toca Compartir y luego «Añadir a pantalla de inicio».'}</p>
      ${_ip ? '<button class="btn btn-soft w-full mt-2" onclick="doInstall()">Instalar</button>' : ''}
    </div>
    <p class="text-xs text-gray-700 mt-4 text-center">Si no ves el botón de instalar, usa el menú ⋮ del navegador → «Instalar app» o «Añadir a pantalla de inicio».</p>`);
  const upd = () => {
    const c1 = $('#sC1').value, r = 1.05 / (lum(c1) + .05);
    $('#sCtr').textContent = r >= 4.5 ? `✔ El color principal tiene buen contraste sobre fondo blanco (${r.toFixed(1)}:1).` : `⚠ El color principal tiene poco contraste sobre fondo blanco (${r.toFixed(1)}:1). Los precios y enlaces se verán débiles: elige un tono más oscuro (mínimo 4.5:1).`;
  };
  $('#sC1').addEventListener('input', upd); upd();
}
let _logo = null;
async function pickLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  try { _logo = await uploadImage(f); $('#sLogo').src = _logo; toast('Logotipo listo, recuerda guardar'); } catch (e) { toast('Error: ' + e.message); }
}
async function saveSettings() {
  const v = id => $('#' + id).value.trim();
  const s = { ...S.settings, business_name: v('sName') || 'Comercios Cagua', logo_url: _logo || S.settings.logo_url || null,
    color_primary: $('#sC1').value, color_accent: $('#sC2').value, whatsapp: normPhone(v('sWa'), v('sCc')), country_code: v('sCc') || '58',
    contact_email: v('sMail'), address: v('sAddr'), pm_bank: v('sPmBank'), pm_id_doc: v('sPmDoc'), pm_phone: v('sPmPhone'),
    tr_bank: v('sTrBank'), tr_account: v('sTrAcc'), tr_holder: v('sTrHolder'), tr_id_doc: v('sTrDoc'),
    legal_name: v('sLegal') || 'Comercios Cagua', rif: v('sRif'), refund_days: Math.min(60, Math.max(1, parseInt(v('sRefund'), 10) || 7)),
    accepts_pickup: $('#sPick').checked, accepts_delivery: $('#sDel').checked };
  if (!s.accepts_pickup && !s.accepts_delivery) return toast('Activa al menos una forma de entrega');
  try { await store.saveSettings(s); S.settings = s; applyBrand(); toast(S.needsSql ? 'Guardado, pero falta ejecutar schema_legal.sql para los datos legales' : 'Configuración guardada'); }
  catch (e) { toast('Error: ' + e.message); }
}

/* ===================== INSTALAR COMO APP + SERVICE WORKER ================ */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _ip = e; if (S.tab === 'settings') { vSettings(); a11y($('#view')); } });
async function doInstall() { if (!_ip) return; _ip.prompt(); await _ip.userChoice.catch(() => {}); _ip = null; if (S.tab === 'settings') { vSettings(); a11y($('#view')); } }
window.addEventListener('appinstalled', () => { _ip = null; });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ============================ LOGIN + ARRANQUE ========================== */
function loginScreen() {
  $('nav').classList.add('hidden');
  view(`<div class="card p-6 mt-10"><h2 class="font-bold text-xl mb-2">Ingresar</h2>
    <p class="text-sm text-gray-800">Acceso restringido al personal autorizado de Comercios Cagua.</p>
    <form onsubmit="event.preventDefault();doLogin()" novalidate>
    <label class="lbl">Correo</label><input id="lE" type="email" class="input" autocomplete="username">
    <label class="lbl">Contraseña</label><input id="lP" type="password" class="input" autocomplete="current-password">
    <button class="btn btn-brand w-full mt-4" type="submit">Entrar</button></form>
    <p class="text-xs text-gray-700 mt-3">Este panel trata datos personales de clientes. <a class="link" href="tienda/privacidad.html" target="_blank" rel="noopener">Política de privacidad</a></p></div>`);
  a11y($('#view'));
}
async function doLogin() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#lE').value.trim(), password: $('#lP').value });
  if (error) { $('#lP').setAttribute('aria-invalid', 'true'); return toast('Correo o contraseña incorrectos'); }
  start();
}
$('#btnLogout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* Cierre de sesión por inactividad (30 min): protege los datos si dejas el teléfono abierto */
let _idle = null;
function armIdle() {
  const reset = () => { clearTimeout(_idle); _idle = setTimeout(async () => { try { await sb.auth.signOut(); } catch {} location.reload(); }, 30 * 60 * 1000); };
  ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, reset, { passive: true })); reset();
}

async function start() {
  try {
    if (sb) {
      const { data } = await sb.auth.getSession();
      if (!data.session) return loginScreen();
      $('#btnLogout').classList.remove('hidden'); armIdle();
    }
    $('nav').classList.remove('hidden');
    await loadAll(); go('home');
  } catch (e) { view(`<div class="card p-4 text-red-800" role="alert">Error al cargar: ${esc(e.message)}</div>`); }
}
start();
</script>
