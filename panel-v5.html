<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="admin-icon-192.png">
<link rel="apple-touch-icon" href="admin-icon-192.png">

<style>
  :root { --brand:#0f766e; --accent:#f59e0b; --on-brand:#ffffff; --focus:#1d4ed8; }
  html, body { overflow-x:clip; max-width:100%; }
  body { -webkit-tap-highlight-color: transparent; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .btn { min-height:48px; border-radius:14px; font-weight:600; padding:0 18px; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn-brand { background:var(--brand); color:var(--on-brand); }
  .btn-soft { background:#e5e7eb; color:#111827; }
  .btn-wa { background:#15803d; color:#fff; }
  .input { width:100%; min-height:48px; border:1.5px solid #6b7280; border-radius:12px; padding:10px 14px; font-size:16px; background:#fff; color:#111827; }
  .input[aria-invalid=true] { border-color:#b91c1c; border-width:2px; }
  :focus-visible { outline:3px solid var(--focus); outline-offset:2px; box-shadow:0 0 0 5px #fff; }
  label:focus-within { outline:3px solid var(--focus); outline-offset:2px; }
  .card { background:#fff; border-radius:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .tab-on { color:var(--brand); font-weight:700; }
  .sheet { animation: up .22s ease-out; } @keyframes up { from { transform:translateY(40px); opacity:0 } to { transform:none; opacity:1 } }
  label.lbl { display:block; font-size:14px; font-weight:600; color:#374151; margin:12px 0 4px; }
  .skip { position:absolute; left:-999px; top:0; background:#fff; color:#000; padding:12px 16px; z-index:100; border-radius:0 0 12px 0; font-weight:600; }
  .skip:focus { left:0; }
  /* Métricas */
  .mx-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .mx-tile { padding:14px; }
  .mx-n { font-size:24px; font-weight:700; line-height:1.1; margin-top:4px; color:#111827; overflow-wrap:anywhere; }
  .mx-l { font-size:13px; font-weight:600; color:#374151; }
  .mx-d { font-size:12px; margin-top:4px; color:#374151; }
  .mx-seg { display:flex; gap:8px; flex-wrap:wrap; }
  .mx-seg button { min-height:44px; padding:0 16px; border-radius:999px; border:1px solid #6b7280; background:#fff; font-size:14px; color:#111827; }
  .mx-seg button[aria-pressed=true] { background:var(--brand); color:var(--on-brand); border-color:transparent; font-weight:600; }
  .mx-h { font-size:17px; font-weight:700; margin:26px 0 4px; }
  .mx-p { font-size:13px; color:#374151; margin:0 0 10px; }
  .mx-read { min-height:44px; font-size:14px; color:#111827; padding:6px 0; }
  .mx-chart { display:block; width:100%; height:auto; touch-action:manipulation; }
  .mx-bar path { fill:var(--brand); }
  .mx-sel .mx-bar { opacity:.4; } .mx-sel .mx-bar.on { opacity:1; }
  .mx-row { margin-bottom:14px; }
  .mx-t { display:flex; justify-content:space-between; gap:10px; font-size:15px; }
  .mx-t span { min-width:0; overflow-wrap:anywhere; }
  .mx-t b { flex:none; }
  .mx-track { height:10px; border-radius:999px; background:#e5e7eb; margin-top:6px; overflow:hidden; }
  .mx-fill { height:10px; border-radius:999px; background:var(--brand); }
  .mx-sub { font-size:12px; color:#374151; margin-top:3px; }
  .mx-lead { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #e5e7eb; }
  .mx-lead:last-child { border-bottom:0; }
  .mx-lead .who { flex:1; min-width:0; } .mx-lead .who b { display:block; overflow-wrap:anywhere; } .mx-lead .who span { font-size:12px; color:#374151; }
  .mx-scroll { max-height:260px; overflow:auto; border:1px solid #d1d5db; border-radius:12px; }
  .mx-table { width:100%; border-collapse:collapse; font-size:14px; }
  .mx-table th, .mx-table td { padding:8px 10px; text-align:left; border-bottom:1px solid #e5e7eb; }
  .mx-table td:nth-child(n+2), .mx-table th:nth-child(n+2) { text-align:right; }
  /* Fotos del producto (hasta 3) y pagos adicionales */
  .px-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
  .px-slot { position:relative; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:#e5e7eb; }
  .px-slot img { width:100%; height:100%; object-fit:cover; display:block; }
  .px-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:26px; color:#374151; border:2px dashed #9ca3af; background:#f3f4f6; }
  .px-empty span { font-size:12px; }
  .px-act { position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:space-between; align-items:center; gap:4px; padding:4px; background:rgba(17,24,39,.72); }
  .px-act button { min-width:44px; min-height:44px; color:#fff; font-size:18px; }
  .px-main { color:#fff; font-size:12px; font-weight:700; padding-left:6px; }
  .xp-item { padding:14px; margin-top:12px; border:1px solid #d1d5db; }
  .xp-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .xp-chips button { min-height:44px; padding:0 14px; border-radius:999px; border:1px solid #6b7280; background:#fff; font-size:14px; }

<body class="bg-gray-100 text-gray-900">
<a class="skip" href="#view">Saltar al contenido</a>

<header id="topbar" class="sticky top-0 z-30 bg-[var(--brand)] px-4 pt-3 pb-3 flex items-center gap-3 shadow" style="color:var(--on-brand)">
  <img id="hLogo" class="w-10 h-10 rounded-full bg-white object-cover hidden" alt="">
  <div class="flex-1 min-w-0">
    <h1 id="hName" class="font-bold truncate">Panel · Comercios Cagua</h1>
    <div id="hMode" class="text-xs"></div>
  </div>
  <button id="btnLogout" class="text-sm underline min-h-[44px] px-2 hidden">Salir</button>
</header>

<main id="view" tabindex="-1" class="p-4 max-w-2xl mx-auto focus:outline-none"></main>

<nav aria-label="Navegación principal" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t flex justify-around" style="padding-bottom:env(safe-area-inset-bottom)">
  <button data-tab="home" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">🏠</span>Inicio</button>
  <button data-tab="metrics" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">📊</span>Métricas</button>
  <button data-tab="products" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">🛍️</span>Productos</button>
  <button data-tab="customers" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">👥</span>Clientes</button>
  <button data-tab="offers" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">📣</span>Ofertas</button>
  <button data-tab="settings" class="flex-1 py-2 min-h-[56px] flex flex-col items-center text-xs text-gray-700"><span class="text-2xl" aria-hidden="true">⚙️</span>Ajustes</button>
</nav>

<div id="modal" class="fixed inset-0 z-50 hidden bg-black/50 flex items-end sm:items-center justify-center">
  <div id="modalBody" tabindex="-1" class="sheet bg-gray-50 w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-5 focus:outline-none"></div>
</div>
<div id="toast" aria-hidden="true" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] bg-gray-900 text-white text-sm px-4 py-2 rounded-full hidden max-w-[90vw] text-center"></div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script>
/* ============================== UTILIDADES ============================== */
const CFG = window.APP_CONFIG || {};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3200);
  const l = $('#live'); l.textContent = ''; setTimeout(() => { l.textContent = msg; }, 30);
}
function safeUrl(u) {
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u.replace(/^\/+/, '');
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}
function lum(hex) {
  const h = String(hex || '#000').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  const f = c => (c /= 255) <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4);
  return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255);
}
const onColor = hex => lum(hex) > .179 ? '#111827' : '#ffffff';

/* Etiquetas asociadas a sus campos (lectores de pantalla) */
function a11y(root = document) {
  root.querySelectorAll('label.lbl').forEach(l => {
    if (l.htmlFor) return; const n = l.nextElementSibling;
    if (n && n.id && /^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName)) l.htmlFor = n.id;
  });
}
/* Ventanas (modal) accesibles */
let _lastFocus = null;
const BG = () => ['#topbar', '#view', 'nav'].map(s => $(s)).filter(Boolean);
function openModal(html) {
  const m = $('#modal'), b = $('#modalBody'), was = !m.classList.contains('hidden'), st = b.scrollTop;
  if (!was) _lastFocus = document.activeElement;
  b.innerHTML = html; m.classList.remove('hidden'); document.body.style.overflow = 'hidden';
  b.setAttribute('role', 'dialog'); b.setAttribute('aria-modal', 'true');
  const h = b.querySelector('h2,h3'); if (h) { h.id = 'dlgTitle'; b.setAttribute('aria-labelledby', 'dlgTitle'); }
  BG().forEach(e => { e.inert = true; }); a11y(b); b.scrollTop = was ? st : 0; if (!was) b.focus({ preventScroll: true });
}
function closeModal() {
  $('#modal').classList.add('hidden'); document.body.style.overflow = ''; $('#modalBody').innerHTML = '';
  BG().forEach(e => { e.inert = false; });
  if (_lastFocus && document.contains(_lastFocus)) _lastFocus.focus({ preventScroll: true }); _lastFocus = null;
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  const open = !$('#modal').classList.contains('hidden');
  if (open && e.key === 'Escape') { closeModal(); return; }
  if (open && e.key === 'Tab') {
    const f = [...$('#modalBody').querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null || x.classList.contains('sr-only'));
    if (!f.length) return; const a = f[0], z = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === a || document.activeElement === $('#modalBody'))) { e.preventDefault(); z.focus(); }
    else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
  }
  const t = e.target.closest && e.target.closest('[role=button]');
  if (t && e.target === t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); t.click(); }
});
document.addEventListener('input', e => { if (e.target.removeAttribute) e.target.removeAttribute('aria-invalid'); });

function normPhone(p, cc) {
  let d = String(p || '').replace(/\D/g, '');
  if (!d) return '';
  cc = cc || '58';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = cc + d.slice(1);       // 0412... -> 58412...
  else if (d.length <= 10 && !d.startsWith(cc)) d = cc + d;
  return d;
}

/* ============================ CAPA DE DATOS ============================= */
// Con credenciales usa Supabase; sin ellas funciona en modo demo (localStorage).
const sb = (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)
  ? supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

/* Si falta ejecutar schema_legal.sql, las columnas nuevas no existen: se guardan sin ellas y se avisa. */
const missingCol = err => { const m = /Could not find the '([^']+)' column/.exec((err && err.message) || ''); return m ? m[1] : null; };
async function sbWrite(run, rows) {
  const arr = Array.isArray(rows) ? rows : [rows];
  for (let i = 0; i < 10; i++) {
    const r = await run(Array.isArray(rows) ? arr : arr[0]);
    if (!r.error) return r;
    const c = missingCol(r.error); if (!c || !arr.some(x => c in x)) throw r.error;
    arr.forEach(x => { delete x[c]; }); S.needsSql = true;
  }
  throw new Error('No se pudo guardar');
}

const store = {
  async list(t, limit = 5000) {
    if (sb) { const { data, error } = await sb.from(t).select('*').order('created_at', { ascending: false }).limit(limit); if (error) throw error; return data; }
    return JSON.parse(localStorage.getItem('mk_' + t) || '[]');
  },
  async save(t, row) {
    row = { ...row };
    if (sb) {
      if (!row.id) delete row.id;
      const r = await sbWrite(x => sb.from(t).upsert(x).select().single(), row); return r.data;
    }
    const all = JSON.parse(localStorage.getItem('mk_' + t) || '[]');
    if (!row.id) { row.id = uid(); row.created_at = new Date().toISOString(); all.unshift(row); }
    else { const i = all.findIndex(x => x.id === row.id); if (i >= 0) all[i] = { ...all[i], ...row }; else all.unshift(row); }
    localStorage.setItem('mk_' + t, JSON.stringify(all)); return row;
  },
  async saveMany(t, rows) {
    if (sb) {
      for (let i = 0; i < rows.length; i += 500) {
        const batch = rows.slice(i, i + 500).map(x => ({ ...x }));
        await sbWrite(x => sb.from(t).upsert(x, { onConflict: 'phone', ignoreDuplicates: true }), batch);
      }
      return;
    }
    const all = JSON.parse(localStorage.getItem('mk_' + t) || '[]');
    const seen = new Set(all.map(x => x.phone || x.email));
    rows.forEach(r => { const k = r.phone || r.email; if (k && seen.has(k)) return; seen.add(k); all.unshift({ ...r, id: uid(), created_at: new Date().toISOString() }); });
    localStorage.setItem('mk_' + t, JSON.stringify(all));
  },
  async remove(t, id) {
    if (sb) { const { error } = await sb.from(t).delete().eq('id', id); if (error) throw error; return; }
    const all = JSON.parse(localStorage.getItem('mk_' + t) || '[]').filter(x => x.id !== id);
    localStorage.setItem('mk_' + t, JSON.stringify(all));
  },
  async getSettings() {
    if (sb) { const { data } = await sb.from('business_settings').select('*').eq('id', 'main').maybeSingle(); return data || {}; }
    return JSON.parse(localStorage.getItem('mk_settings') || '{}');
  },
  async saveSettings(s) {
    s = { ...s, id: 'main', updated_at: new Date().toISOString() };
    if (sb) { await sbWrite(x => sb.from('business_settings').upsert(x), s); return; }
    localStorage.setItem('mk_settings', JSON.stringify(s));
  }
};

/* ===================== SUBIDA DE IMÁGENES + COMPRESIÓN ================== */
// Comprime en el teléfono (máx 1280px, JPEG 80%) antes de subir => cargas ultrarrápidas.
function compressImage(file, maxSize = 1280, quality = 0.8) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, maxSize / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? resolve(b) : reject(new Error('No se pudo comprimir')); }, 'image/jpeg', quality);
    };
    img.onerror = () => reject(new Error('Imagen inválida'));
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });

async function uploadImage(file) {
  const blob = await compressImage(file);
  if (CFG.CLOUDINARY_CLOUD_NAME && CFG.CLOUDINARY_UPLOAD_PRESET) {
    const fd = new FormData(); fd.append('file', blob); fd.append('upload_preset', CFG.CLOUDINARY_UPLOAD_PRESET);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUDINARY_CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
    const j = await r.json(); if (!j.secure_url) throw new Error('Falló la subida a Cloudinary');
    return j.secure_url.replace('/upload/', '/upload/f_auto,q_auto/');   // entrega optimizada
  }
  if (sb) {
    const path = `products/${uid()}.jpg`;
    const { error } = await sb.storage.from('media').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  }
  return await blobToDataURL(blob);   // modo demo
}

/* ============================== ESTADO ================================== */
const S = { tab: 'home', settings: {}, products: [], customers: [], orders: [], custLimit: 40, custQuery: '', custFilter: 'all', needsSql: false, mDays: 30 };

function applyBrand() {
  const s = S.settings, root = document.documentElement.style;
  root.setProperty('--brand', s.color_primary || '#0f766e'); root.setProperty('--accent', s.color_accent || '#f59e0b');
  root.setProperty('--on-brand', onColor(s.color_primary || '#0f766e'));
  document.querySelector('meta[name=theme-color]').content = s.color_primary || '#0f766e';
  const nm = s.business_name && s.business_name !== 'Mi Negocio' ? s.business_name : 'Comercios Cagua';
  $('#hName').textContent = 'Panel · ' + nm;
  const l = $('#hLogo'); if (s.logo_url) { l.src = s.logo_url; l.classList.remove('hidden'); } else l.classList.add('hidden');
  $('#hMode').textContent = sb ? 'Conectado a Supabase' : 'Modo demo (datos locales)';
}

async function loadAll() {
  [S.settings, S.products, S.customers, S.orders] = await Promise.all([store.getSettings(), store.list('products'), store.list('customers', 20000), store.list('orders', 5000)]);
  if (sb && (!('legal_name' in S.settings) || !('extra_payments' in S.settings))) S.needsSql = true;
  applyBrand();
}

function go(tab) {
  S.tab = tab;
  document.querySelectorAll('nav button').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('tab-on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  ({ home: vHome, metrics: vMetrics, products: vProducts, customers: vCustomers, offers: vOffers, settings: vSettings })[tab]();
  a11y($('#view')); window.scrollTo(0, 0); $('#view').focus({ preventScroll: true });
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

const view = html => { $('#view').innerHTML = html; };
const waLink = (phone, text) => `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;

/* =============================== INICIO ================================= */
function vHome() {
  const optin = S.customers.filter(c => c.marketing_consent).length;
  const pend = S.orders.filter(o => o.status === 'pendiente');
  const ventas = S.orders.filter(o => CONF.includes(o.status)).reduce((a, o) => a + Number(o.total || 0), 0);
  const stat = (n, l, ic) => `<div class="card p-4"><div class="text-2xl" aria-hidden="true">${ic}</div><div class="text-2xl font-bold">${n}</div><div class="text-xs text-gray-700">${l}</div></div>`;
  const s = S.settings, falta = !s.rif || !(s.contact_email || s.whatsapp) || !s.address;
  view(`
    ${S.needsSql ? `<div class="card p-4 mb-3 border-2 border-amber-500" role="alert"><b>⚠️ Falta actualizar la base de datos</b><p class="text-sm mt-1">Ejecuta <code>schema_v3.sql</code> en Supabase (SQL Editor) para guardar hasta 3 fotos por producto y las formas de pago adicionales. Si aún no ejecutaste <code>schema_legal.sql</code>, ejecútalo también.</p></div>` : ''}
    ${falta ? `<div class="card p-4 mb-3 border-2 border-amber-500"><b>📋 Completa tus datos legales</b><p class="text-sm mt-1">Faltan datos del negocio (RIF, dirección o un medio de contacto) que aparecen en las páginas legales de la tienda.</p><button class="btn btn-soft mt-2 w-full" onclick="go('settings')">Ir a Ajustes</button></div>` : ''}
    <div class="grid grid-cols-2 gap-3">
      ${stat(S.products.length, 'Productos', '🛍️')}${stat(S.customers.length, 'Clientes', '👥')}
      ${stat(optin, 'Aceptan ofertas', '✅')}${stat(money(ventas), 'Ventas confirmadas', '💰')}
    </div>

// Venta confirmada = pedido pagado, enviado o entregado. Los pendientes se muestran aparte y los cancelados no cuentan.
const CONF = ['pagado', 'enviado', 'entregado'];
const PAYLBL = { pago_movil: 'Pago Móvil', transferencia: 'Transferencia', whatsapp: 'Acuerdo por WhatsApp' };
const payName = k => PAYLBL[k] || k || 'Sin indicar';
const STSING = { pendiente: '⏳ Pendiente', pagado: '✅ Pagado', enviado: '🚚 Enviado', entregado: '📦 Entregado', cancelado: '✕ Cancelado' };
const STLBL = { pendiente: '⏳ Pendientes', pagado: '✅ Pagados', enviado: '🚚 Enviados', entregado: '📦 Entregados', cancelado: '✕ Cancelados' };
const RANGES = [[7, '7 días'], [30, '30 días'], [90, '90 días'], [365, '12 meses']];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const pad2 = n => String(n).padStart(2, '0');
const dKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const mKey = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1);
const sumTotal = a => a.reduce((s, o) => s + Number(o.total || 0), 0);
const pctDiff = (a, b) => (b ? Math.round((a - b) / b * 100) : null);
const niceMax = m => { if (!(m > 0)) return 10; const p = Math.pow(10, Math.floor(Math.log10(m))), f = m / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
const moneyK = v => (v >= 1000 ? '$' + (v / 1000).toFixed(v >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : '$' + Math.round(v));

function metricsData(days) {
  const now = new Date(), monthly = days >= 365;
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const start = monthly ? new Date(now.getFullYear(), now.getMonth() - 11, 1) : new Date(now.getFullYear(), now.getMonth(), now.getDate() - (days - 1));
  const prevStart = monthly ? new Date(now.getFullYear(), now.getMonth() - 23, 1) : new Date(start.getFullYear(), start.getMonth(), start.getDate() - days);
  const ord = S.orders.map(o => ({ ...o, t: new Date(o.created_at) }));
  const cur = ord.filter(o => o.t >= start && o.t < end), prev = ord.filter(o => o.t >= prevStart && o.t < start);
  const conf = cur.filter(o => CONF.includes(o.status)), confPrev = prev.filter(o => CONF.includes(o.status));
  // Cubetas: un día cada una (o un mes en "12 meses")
  const buckets = [], idx = {};
  if (monthly) for (let i = 0; i < 12; i++) { const d = new Date(start.getFullYear(), start.getMonth() + i, 1); idx[mKey(d)] = buckets.length; buckets.push({ label: MESES[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2), v: 0, n: 0 }); }
  else for (let i = 0; i < days; i++) { const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i); idx[dKey(d)] = buckets.length; buckets.push({ label: d.getDate() + ' ' + MESES[d.getMonth()], v: 0, n: 0 }); }
  conf.forEach(o => { const b = buckets[idx[monthly ? mKey(o.t) : dKey(o.t)]]; if (b) { b.v += Number(o.total || 0); b.n++; } });
  // Productos y formas de pago (solo ventas confirmadas)
  const prods = new Map(), pays = new Map();
  conf.forEach(o => {
    (Array.isArray(o.items) ? o.items : []).forEach(it => {
      const k = it.product_id || it.name, r = prods.get(k) || { label: it.name || 'Producto', v: 0, q: 0 };
      r.v += Number(it.price || 0) * Number(it.qty || 1); r.q += Number(it.qty || 1); prods.set(k, r);
    });
    const k = payName(o.payment_method), r = pays.get(k) || { label: k, v: 0, n: 0 }; r.v += Number(o.total || 0); r.n++; pays.set(k, r);
  });
  const status = {}; cur.forEach(o => { status[o.status] = (status[o.status] || 0) + 1; });
  const pend = cur.filter(o => o.status === 'pendiente');
  const newCust = S.customers.filter(c => { const t = new Date(c.created_at); return t >= start && t < end; }).length;
  const newCustPrev = S.customers.filter(c => { const t = new Date(c.created_at); return t >= prevStart && t < start; }).length;
  return { monthly, buckets, conf, confPrev, ventas: sumTotal(conf), ventasPrev: sumTotal(confPrev), pend, pendTotal: sumTotal(pend),
    newCust, newCustPrev, status, cancel: cur.filter(o => o.status === 'cancelado').length,
    prods: [...prods.values()].sort((a, b) => b.v - a.v).slice(0, 5), pays: [...pays.values()].sort((a, b) => b.v - a.v) };
}

function leadsData() {
  const byC = new Map();
  S.orders.forEach(o => { if (!o.customer_id || o.status === 'cancelado') return; if (!byC.has(o.customer_id)) byC.set(o.customer_id, []); byC.get(o.customer_id).push(o); });
  const buyers = S.customers.filter(c => byC.has(c.id)), leads = S.customers.filter(c => !byC.has(c.id));
  const contactable = leads.filter(c => c.marketing_consent && c.phone);
  const repeat = buyers.filter(c => byC.get(c.id).length >= 2);
  const dormant = buyers.map(c => ({ c, last: Math.max(...byC.get(c.id).map(o => +new Date(o.created_at))) }))
    .filter(x => Date.now() - x.last > 60 * 864e5 && x.c.marketing_consent && x.c.phone).sort((a, b) => a.last - b.last);
  return { buyers, leads, contactable, repeat, dormant, optin: S.customers.filter(c => c.marketing_consent).length };
}

function colChart(b) {
  const W = 640, H = 230, L = 46, R = 8, T = 12, B = 30, pw = W - L - R, ph = H - T - B;
  const max = niceMax(Math.max(...b.map(x => x.v), 0)), bw = pw / b.length, gap = Math.min(4, bw * .25), w = Math.max(2, bw - gap), r0 = Math.min(3, w / 2);
  const grid = [0, .5, 1].map(f => { const y = T + ph - f * ph; return `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#d1d5db" stroke-width="1"${f ? ' stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="12" fill="#374151">${moneyK(max * f)}</text>`; }).join('');
  const step = Math.ceil(b.length / 6);
  const bars = b.map((x, i) => {
    const h = x.v / max * ph, px = L + i * bw + (bw - w) / 2, y = T + ph - h, r = Math.min(r0, h);
    const path = h > 0 ? `<path d="M${px},${y + h}V${y + r}Q${px},${y} ${px + r},${y}H${px + w - r}Q${px + w},${y} ${px + w},${y + r}V${y + h}Z"/>` : '';
    const lab = i % step === 0 ? `<text x="${px + w / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#374151">${esc(x.label)}</text>` : '';
    return `<g class="mx-bar" data-i="${i}">${path}<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${ph}" fill="transparent"/>${lab}</g>`;
  }).join('');
  return `<svg id="mChart" class="mx-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ventas confirmadas por ${b.length === 12 ? 'mes' : 'día'}. Los valores están en la tabla de abajo.">${grid}${bars}</svg>`;
}
function hbars(rows, fmt) {
  const max = Math.max(...rows.map(r => r.v), 1);
  return rows.map(r => `<div class="mx-row"><div class="mx-t"><span>${esc(r.label)}</span><b>${fmt(r.v)}</b></div><div class="mx-track" aria-hidden="true"><div class="mx-fill" style="width:${Math.max(2, r.v / max * 100)}%"></div></div>${r.sub ? `<div class="mx-sub">${esc(r.sub)}</div>` : ''}</div>`).join('');
}

/* ====================== INTERÉS POR PRODUCTO (MÉTRICAS) ===================== */
// Puntaje por visitante y producto: vista +1 · tiempo ≥10 s +2, ≥30 s +3 · fotos 2 y 3 +1 c/u · carrito +5 (quitar −2)
// · compartir +4 · WhatsApp +4 · comprar +10. Pierde la mitad cada 14 días. Frío <3 · Tibio 3–7 · Caliente 8 o más.
// En Supabase lo calcula interest_summary (schema_v4.sql); en modo demo se calcula aquí con la misma regla.
const lvl = n => (n >= 8 ? ['🔥', 'Caliente'] : n >= 3 ? ['🌤️', 'Tibio'] : ['❄️', 'Frío']);
const DOWN = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
function demoInterest(days) {
  const ls = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
  const now = Date.now(), since = now - days * 864e5, evs = ls('mk_events').filter(e => +new Date(e.ts) >= since);
  const act = S.products.filter(p => p.is_active !== false), byId = new Map(act.map(p => [String(p.id), p]));
  const pairs = new Map();

/* CSV (compatible con Excel: UTF-8 con BOM) */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  const sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur.replace(/\r$/, '')); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur.replace(/\r$/, '')); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
function exportCSV() {
  if (!confirm('El archivo contendrá datos personales de tus clientes. Guárdalo en un lugar seguro y no lo compartas. ¿Continuar?')) return;
  const head = ['nombre', 'correo', 'telefono', 'acepta_ofertas', 'compras'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [head.join(',')].concat(S.customers.map(c => [c.name, c.email, c.phone, c.marketing_consent ? 'si' : 'no', S.orders.filter(o => o.customer_id === c.id).length].map(q).join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'clientes.csv'; a.click();
}
async function importCSV(inp) {
  const f = inp.files[0]; if (!f) return;
  const rows = parseCSV(await f.text()); if (rows.length < 2) { inp.value = ''; return toast('Archivo vacío'); }
  const h = rows[0].map(x => x.trim().toLowerCase());
  const ix = k => h.findIndex(x => k.some(w => x.includes(w)));
  const iN = ix(['nombre', 'name']), iE = ix(['correo', 'email', 'mail']), iP = ix(['tel', 'phone', 'whats']), iO = ix(['acepta', 'consent', 'optin']);
  if (iN < 0) { inp.value = ''; return toast('Falta la columna "nombre"'); }
  const now = new Date().toISOString();
  const out = rows.slice(1).map(r => {
    const opt = iO >= 0 ? /^(si|sí|yes|1|true|x)$/i.test((r[iO] || '').trim()) : false;
    return { name: (r[iN] || '').trim(), email: iE >= 0 ? (r[iE] || '').trim() || null : null,
      phone: iP >= 0 ? normPhone(r[iP], S.settings.country_code) || null : null,
      marketing_consent: opt, consent_at: opt ? now : null, consent_source: opt ? 'import' : null,
      consent_text: opt ? 'Importado por el administrador, que declaró contar con el consentimiento del cliente' : null, source: 'import' };
  }).filter(c => c.name && (c.phone || c.email));
  const withOpt = out.filter(c => c.marketing_consent).length;
  if (withOpt && !confirm(`${withOpt} contactos están marcados como “aceptan ofertas”.\n\nAl importar declaras que tienes su consentimiento para escribirles con ofertas (y que puedes demostrarlo). Si no es así, cancela y vuelve a importar con la columna acepta_ofertas en “no”.\n\n¿Confirmas?`)) { inp.value = ''; return; }
  try { await store.saveMany('customers', out); S.customers = await store.list('customers', 20000); vCustomers(); a11y($('#view')); toast(`${out.length} contactos procesados`); }
  catch (e) { toast('Error: ' + e.message); }
}

      <div class="xp-chips" role="group" aria-label="Agregar una forma de pago frecuente">${XP_QUICK.map(n => `<button type="button" onclick="xpAdd('${n}')">＋ ${n}</button>`).join('')}</div>
      <button type="button" class="btn btn-soft w-full mt-3" onclick="xpAdd()">＋ Agregar otra</button>
      <p class="text-xs text-gray-700 mt-2">Nunca pidas ni guardes claves ni datos de tarjeta. Recuerda guardar la configuración al final.</p>
    </div>
    <h3 class="font-bold mt-5 mb-2">Entrega</h3>
    <div class="card p-4 space-y-3">
      <label class="flex items-center gap-3"><input id="sPick" type="checkbox" class="w-6 h-6" ${s.accepts_pickup !== false ? 'checked' : ''}> Retiro en tienda</label>
      <label class="flex items-center gap-3"><input id="sDel" type="checkbox" class="w-6 h-6" ${s.accepts_delivery !== false ? 'checked' : ''}> Envío a domicilio / Delivery</label>
    </div>
    <button class="btn btn-brand w-full mt-5" onclick="saveSettings()">Guardar configuración</button>
    <div id="instBox" class="card p-4 mt-5" ${_ip || /iphone|ipad|ipod/i.test(navigator.userAgent) ? '' : 'hidden'}>
      <b>📲 Instalar el panel como app</b>
      <p class="text-sm text-gray-800 mt-1">${_ip ? 'Ábrelo desde tu pantalla de inicio, sin la barra del navegador.' : 'En iPhone: toca Compartir y luego «Añadir a pantalla de inicio».'}</p>
      ${_ip ? '<button class="btn btn-soft w-full mt-2" onclick="doInstall()">Instalar</button>' : ''}
    </div>
    <p class="text-xs text-gray-700 mt-4 text-center">Si no ves el botón de instalar, usa el menú ⋮ del navegador → «Instalar app» o «Añadir a pantalla de inicio».</p>`);
  const upd = () => {
    const c1 = $('#sC1').value, r = 1.05 / (lum(c1) + .05);
    $('#sCtr').textContent = r >= 4.5 ? `✔ El color principal tiene buen contraste sobre fondo blanco (${r.toFixed(1)}:1).` : `⚠ El color principal tiene poco contraste sobre fondo blanco (${r.toFixed(1)}:1). Los precios y enlaces se verán débiles: elige un tono más oscuro (mínimo 4.5:1).`;
  };
  $('#sC1').addEventListener('input', upd); upd();
}
let _xp = [];
const XP_QUICK = ['Zelle', 'Binance Pay', 'PayPal', 'Efectivo (USD)'];
const XP_RESERVED = ['pago movil', 'pago móvil', 'transferencia', 'transferencia bancaria', 'whatsapp', 'acuerdo por whatsapp', 'pago_movil'];
function xpHtml() {
  return _xp.map((x, i) => `<div class="card xp-item">
    <label class="lbl" for="xpN${i}">Nombre de la forma de pago</label><input id="xpN${i}" class="input" maxlength="40" value="${esc(x.name)}" placeholder="Ej: Zelle">
    <label class="lbl" for="xpD${i}">Datos para pagar (los ve el cliente)</label><textarea id="xpD${i}" rows="3" maxlength="400" class="input" placeholder="Correo o cuenta, titular e instrucciones">${esc(x.details)}</textarea>
    <label class="flex items-center gap-3 mt-3"><input id="xpR${i}" type="checkbox" class="w-6 h-6" ${x.ref !== false ? 'checked' : ''}> Pedir número de referencia</label>
    <label class="flex items-center gap-3 mt-3"><input id="xpO${i}" type="checkbox" class="w-6 h-6" ${x.on !== false ? 'checked' : ''}> Activa en la tienda</label>
    <button type="button" class="btn btn-soft w-full mt-3" onclick="xpDel(${i})"><span aria-hidden="true">🗑️</span> Quitar esta forma de pago</button></div>`).join('');
}
function xpSync() {
  _xp = _xp.map((x, i) => $('#xpN' + i) ? { name: $('#xpN' + i).value, details: $('#xpD' + i).value, ref: $('#xpR' + i).checked, on: $('#xpO' + i).checked } : x);
}
function xpAdd(name) {
  xpSync(); if (_xp.length >= 8) return toast('Máximo 8 formas de pago adicionales');
  _xp.push({ name: name || '', details: '', ref: true, on: true });
  $('#xpList').innerHTML = xpHtml(); a11y($('#xpList')); const i = _xp.length - 1; (name ? $('#xpD' + i) : $('#xpN' + i)).focus();
}
function xpDel(i) { xpSync(); _xp.splice(i, 1); $('#xpList').innerHTML = xpHtml(); a11y($('#xpList')); }
function xpClean() {
  xpSync(); const seen = new Set(), out = [];
  for (const x of _xp) {
    const name = String(x.name || '').trim().slice(0, 40), details = String(x.details || '').trim().slice(0, 400);
    if (!name && !details) continue;
    if (!name) throw new Error('Una forma de pago no tiene nombre');
    const k = name.toLowerCase();
    if (XP_RESERVED.includes(k)) throw new Error('“' + name + '” ya existe como forma de pago fija: usa otro nombre');
    if (seen.has(k)) throw new Error('Hay dos formas de pago llamadas “' + name + '”');
    if (!details) throw new Error('Agrega los datos para pagar en “' + name + '”');
    seen.add(k); out.push({ name, details, ref: x.ref !== false, on: x.on !== false });
  }
  return out;
}
let _logo = null;
async function pickLogo(inp) {
  const f = inp.files[0]; if (!f) return;
  try { _logo = await uploadImage(f); $('#sLogo').src = _logo; toast('Logotipo listo, recuerda guardar'); } catch (e) { toast('Error: ' + e.message); }
}
async function saveSettings() {
  const v = id => $('#' + id).value.trim();
  const s = { ...S.settings, business_name: v('sName') || 'Comercios Cagua', logo_url: _logo || S.settings.logo_url || null,
    color_primary: $('#sC1').value, color_accent: $('#sC2').value, whatsapp: normPhone(v('sWa'), v('sCc')), country_code: v('sCc') || '58',
    contact_email: v('sMail'), address: v('sAddr'), pm_bank: v('sPmBank'), pm_id_doc: v('sPmDoc'), pm_phone: v('sPmPhone'),
    tr_bank: v('sTrBank'), tr_account: v('sTrAcc'), tr_holder: v('sTrHolder'), tr_id_doc: v('sTrDoc'),
    legal_name: v('sLegal') || 'Comercios Cagua', rif: v('sRif'), refund_days: Math.min(60, Math.max(1, parseInt(v('sRefund'), 10) || 7)),
    accepts_pickup: $('#sPick').checked, accepts_delivery: $('#sDel').checked };
  if (!s.accepts_pickup && !s.accepts_delivery) return toast('Activa al menos una forma de entrega');
  try { s.extra_payments = xpClean(); } catch (e) { return toast(e.message); }
  try { await store.saveSettings(s); S.settings = s; applyBrand(); toast(S.needsSql ? 'Guardado, pero falta ejecutar schema_v3.sql (y schema_legal.sql) en Supabase para guardar todos los datos' : 'Configuración guardada'); }
  catch (e) { toast('Error: ' + e.message); }
}

/* ===================== INSTALAR COMO APP + SERVICE WORKER ================ */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _ip = e; if (S.tab === 'settings') { vSettings(); a11y($('#view')); } });
async function doInstall() { if (!_ip) return; _ip.prompt(); await _ip.userChoice.catch(() => {}); _ip = null; if (S.tab === 'settings') { vSettings(); a11y($('#view')); } }
window.addEventListener('appinstalled', () => { _ip = null; });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ============================ LOGIN + ARRANQUE ========================== */
function loginScreen() {
  $('nav').classList.add('hidden');
  view(`<div class="card p-6 mt-10"><h2 class="font-bold text-xl mb-2">Ingresar</h2>
    <p class="text-sm text-gray-800">Acceso restringido al personal autorizado de Comercios Cagua.</p>
    <form onsubmit="event.preventDefault();doLogin()" novalidate>
    <label class="lbl">Correo</label><input id="lE" type="email" class="input" autocomplete="username">
    <label class="lbl">Contraseña</label><input id="lP" type="password" class="input" autocomplete="current-password">
    <button class="btn btn-brand w-full mt-4" type="submit">Entrar</button></form>
    <p class="text-xs text-gray-700 mt-3">Este panel trata datos personales de clientes. <a class="link" href="tienda/privacidad.html" target="_blank" rel="noopener">Política de privacidad</a></p></div>`);
  a11y($('#view'));
}
async function doLogin() {
  const { error } = await sb.auth.signInWithPassword({ email: $('#lE').value.trim(), password: $('#lP').value });
  if (error) { $('#lP').setAttribute('aria-invalid', 'true'); return toast('Correo o contraseña incorrectos'); }
  start();
}
$('#btnLogout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* Cierre de sesión por inactividad (30 min): protege los datos si dejas el teléfono abierto */
let _idle = null;
function armIdle() {
  const reset = () => { clearTimeout(_idle); _idle = setTimeout(async () => { try { await sb.auth.signOut(); } catch {} location.reload(); }, 30 * 60 * 1000); };
  ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(ev => addEventListener(ev, reset, { passive: true })); reset();
}

async function start() {
  try {
    if (sb) {
      const { data } = await sb.auth.getSession();
      if (!data.session) return loginScreen();
      $('#btnLogout').classList.remove('hidden'); armIdle();
    }
    $('nav').classList.remove('hidden');
    await loadAll(); go('home');
  } catch (e) { view(`<div class="card p-4 text-red-800" role="alert">Error al cargar: ${esc(e.message)}</div>`); }
}
start();
</script>
